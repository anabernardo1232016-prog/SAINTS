<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel SAINTS - Peaky Blinders</title>
    <!-- Firebase SDKs -->
    <!-- Firebase App (obrigatório) -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<!-- Firebase Realtime Database -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        body { background-color: #0c0a08; color: #e6dfcc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; }
        h1, h2, h3 { color: #c5a059; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: #14100c; border: 1px solid #36281e; padding: 20px; border-radius: 6px; margin-bottom: 20px; }
        input, select, textarea { background: #1c1611; border: 1px solid #36281e; color: #e6dfcc; padding: 8px; border-radius: 4px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        button.btn-acao { background: #c5a059; color: #0c0a08; border: none; padding: 10px 15px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button.btn-acao:hover { background: #d4af37; }
    </style>
</head>
<body>
    <div class="container">
        <h1>By Order of the Peaky Blinders - SAINTS</h1>

        <!-- TABELA DE ARMAS -->
        <div class="card">
            <h2>Tabela de Armas</h2>
            <form onsubmit="adicionarTabelaArma(event)">
                <input type="text" id="tabela-arma-nome" placeholder="Nome da Arma" required>
                <input type="number" step="0.01" id="tabela-arma-preco" placeholder="Preço (€)" required>
                <button type="submit" class="btn-acao">Adicionar Arma</button>
            </form>
            <ul id="lista-tabela-armas" style="list-style:none; padding:0; margin-top:15px;"></ul>
        </div>

        <!-- CRAFTS SAINTS -->
        <div class="card">
            <h2>Crafts Saints</h2>
            <form onsubmit="adicionarCraftSaints(event)">
                <input type="text" id="craftsaints-nome" placeholder="Nome do Craft" required>
                <textarea id="craftsaints-ingredientes" placeholder="Ingredientes necessários" rows="3" required></textarea>
                <input type="text" id="craftsaints-produz" placeholder="O que produz (ex: 2x Item)" required>
                <button type="submit" class="btn-acao">Registar Craft</button>
            </form>
            <div id="lista-craftsaints" style="margin-top:15px;"></div>
        </div>

        <!-- GUARDA-ROUPA -->
        <div class="card">
            <h2>Guarda-Roupa</h2>
            <form onsubmit="adicionarRoupa(event)">
                <input type="text" id="roupa-nome" placeholder="Nome da Roupa / Conjunto" required>
                <input type="url" id="roupa-img" placeholder="Link da Imagem (opcional)">
                <button type="submit" class="btn-acao">Adicionar Roupa</button>
            </form>
            <div id="lista-roupas" style="margin-top:15px;"></div>
        </div>

        <!-- RECEITAS -->
        <div class="card">
            <h2>Receitas</h2>
            <form onsubmit="adicionarReceita(event)">
                <input type="text" id="receita-nome" placeholder="Nome da Receita" required>
                <textarea id="receita-ingredientes" placeholder="Ingredientes e passos" rows="3" required></textarea>
                <button type="submit" class="btn-acao">Adicionar Receita</button>
            </form>
            <div id="lista-receitas" style="margin-top:15px;"></div>
        </div>

        <!-- PEDIDOS DE CLIENTES -->
        <div class="card">
            <h2>Pedidos de Clientes (<span id="contador-pedidos-clientes">0</span>)</h2>
            <form onsubmit="guardarPedidoCompleto(event)">
                <input type="text" id="cli-nome" placeholder="Nome do Cliente" required>
                <div style="display:flex; gap:10px;">
                    <select id="cli-select-produto" style="flex:2;"></select>
                    <input type="number" id="cli-qtd" value="1" min="1" style="flex:1;" placeholder="Qtd">
                    <button type="button" onclick="adicionarItemAoCarrinho()" class="btn-acao" style="flex:1;">+ Item</button>
                </div>
                <div id="carrinho-itens" style="margin:10px 0;"></div>
                <label style="font-size:0.85rem; color:#b8a894;">Valor Total (€):</label>
                <input type="number" step="0.01" id="cli-total-manual" readonly required>
                <button type="submit" class="btn-acao" style="margin-top:10px;">Registar Pedido Completo</button>
            </form>
            <div id="lista-pedidos-pendentes" style="margin-top:15px;"></div>
        </div>

        <!-- ENCOMENDAS -->
        <div class="card">
            <h2>Encomendas Feitas (<span id="contador-encomendas">0</span>)</h2>
            <form onsubmit="adicionarEncomendaManual(event)">
                <h3>Encomenda Geral</h3>
                <input type="text" id="enc-man-pessoa" placeholder="Responsável" required>
                <input type="text" id="enc-man-empresa" placeholder="Empresa / Fornecedor" required>
                <input type="text" id="enc-man-item" placeholder="Item / Pedido" required>
                <input type="number" step="0.01" id="enc-man-gasto" placeholder="Gasto Total (€)" required>
                <button type="submit" class="btn-acao">Registar Encomenda Geral</button>
            </form>
            <hr style="border-color:#36281e; margin:20px 0;">
            <form onsubmit="adicionarEncomendaArmas(event)">
                <h3>Encomenda de Armamento</h3>
                <input type="text" id="enc-arm-pessoa" placeholder="Responsável" required>
                <input type="text" id="enc-arm-empresa" placeholder="Empresa / Fornecedor" required>
                <select id="enc-select-arma" required></select>
                <input type="number" id="enc-arm-qtd" value="1" min="1" placeholder="Quantidade" required>
                <button type="submit" class="btn-acao">Registar Encomenda de Armas</button>
            </form>
            <div id="lista-encomendas" style="margin-top:15px;"></div>
        </div>

        <!-- SPOTS -->
        <div class="card">
            <h2>Gestão de Spots</h2>
            <form onsubmit="adicionarSpot('farm', event)">
                <h3>Adicionar Spot de Farm</h3>
                <input type="text" id="spot-farm-nome" placeholder="Localização / Nome" required>
                <input type="text" id="spot-farm-info" placeholder="Informação / Descrição" required>
                <input type="url" id="spot-farm-img" placeholder="Link da Imagem (opcional)">
                <button type="submit" class="btn-acao">Adicionar Spot de Farm</button>
            </form>
            <div id="lista-spots-farm" style="margin-top:15px;"></div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DO FIREBASE (Substitua com os dados do seu projeto)
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_AUTH_DOMAIN",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_STORAGE_BUCKET",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Arrays locais em memória
        let tabelaArmas = [];
        let produtos = [];
        let craftsSaints = [];
        let roupas = [];
        let receitas = [];
        let carrinhoAtual = [];
        let pedidosClientes = [];
        let encomendasFeitas = [];
        let spots = { farm: [] };

        // --- FUNÇÕES DE SINCRONIZAÇÃO COM O FIREBASE ---

        function carregarDados() {
            // Tabela de Armas
            db.collection("tabelaArmas").onSnapshot(snapshot => {
                tabelaArmas = [];
                snapshot.forEach(doc => tabelaArmas.push({ id: doc.id, ...doc.data() }));
                renderizarTabelaArmas();
                atualizarSelectArmas();
            });

            // Crafts Saints
            db.collection("craftsSaints").onSnapshot(snapshot => {
                craftsSaints = [];
                snapshot.forEach(doc => craftsSaints.push({ id: doc.id, ...doc.data() }));
                renderizarCraftsSaints();
            });

            // Guarda-Roupa
            db.collection("roupas").onSnapshot(snapshot => {
                roupas = [];
                snapshot.forEach(doc => roupas.push({ id: doc.id, ...doc.data() }));
                renderizarRoupas();
            });

            // Receitas
            db.collection("receitas").onSnapshot(snapshot => {
                receitas = [];
                snapshot.forEach(doc => receitas.push({ id: doc.id, ...doc.data() }));
                renderizarReceitas();
            });

            // Pedidos de Clientes
            db.collection("pedidosClientes").onSnapshot(snapshot => {
                pedidosClientes = [];
                snapshot.forEach(doc => pedidosClientes.push({ id: doc.id, ...doc.data() }));
                renderizarPedidosClientes();
            });

            // Encomendas
            db.collection("encomendasFeitas").onSnapshot(snapshot => {
                encomendasFeitas = [];
                snapshot.forEach(doc => encomendasFeitas.push({ id: doc.id, ...doc.data() }));
                renderizarEncomendas();
            });

            // Spots de Farm
            db.collection("spotsFarm").onSnapshot(snapshot => {
                spots.farm = [];
                snapshot.forEach(doc => spots.farm.push({ id: doc.id, ...doc.data() }));
                renderizarSpots('farm');
            });
        }

        // --- TABELA DE ARMAS ---
        function renderizarTabelaArmas() {
            const lista = document.getElementById('lista-tabela-armas');
            if (!lista) return;
            lista.innerHTML = '';
            tabelaArmas.forEach((a) => {
                lista.innerHTML += `<li style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #36281e; color:#b8a894;">
                    <span>⚔️ ${a.nome}</span><div><strong style="margin-right:15px; color:#c5a059;">${parseFloat(a.preco).toFixed(2)} €</strong><button onclick="removerTabelaArma('${a.id}')" style="background:none;border:none;color:#9e2a2b;cursor:pointer;">✕</button></div>
                </li>`;
            });
        }
        function adicionarTabelaArma(e) {
            e.preventDefault();
            const nome = document.getElementById('tabela-arma-nome').value.trim();
            const preco = parseFloat(document.getElementById('tabela-arma-preco').value);
            db.collection("tabelaArmas").add({ nome, preco }).then(() => {
                document.getElementById('tabela-arma-nome').value = '';
                document.getElementById('tabela-arma-preco').value = '';
            });
        }
        function removerTabelaArma(id) { db.collection("tabelaArmas").doc(id).delete(); }

        // --- CRAFTS SAINTS ---
        function renderizarCraftsSaints() {
            const container = document.getElementById('lista-craftsaints');
            if (!container) return;
            if (craftsSaints.length === 0) {
                container.innerHTML = '<p style="color:#7a6c5d;">Nenhum craft registado.</p>';
                return;
            }
            container.innerHTML = '';
            craftsSaints.forEach((c) => {
                container.innerHTML += `
                <div style="background:#14100c; border:1px solid #36281e; padding:14px; border-radius:4px; margin-bottom:12px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span style="color:#c5a059; font-size:1.1rem;">⚜️</span>
                            <strong style="color:#ffffff; font-size:1rem;">${c.nome}</strong>
                            <span style="color:#c5a059; font-weight:bold; font-size:0.95rem; margin-left:8px;">${c.produz.startsWith('=') ? c.produz : '= ' + c.produz}</span>
                        </div>
                        <button onclick="removerCraftSaints('${c.id}')" style="background:none; border:none; color:#9e2a2b; cursor:pointer; font-weight:bold; font-size:1rem;">✕</button>
                    </div>
                    <div style="color:#b8a894; font-size:0.88rem; line-height:1.4; white-space:pre-line; padding-left:24px;">${c.ingredientes}</div>
                </div>`;
            });
        }
        function adicionarCraftSaints(e) {
            e.preventDefault();
            const nome = document.getElementById('craftsaints-nome').value.trim();
            const ingredientes = document.getElementById('craftsaints-ingredientes').value.trim();
            const produz = document.getElementById('craftsaints-produz').value.trim();
            db.collection("craftsSaints").add({ nome, ingredientes, produz }).then(() => {
                document.getElementById('craftsaints-nome').value = '';
                document.getElementById('craftsaints-ingredientes').value = '';
                document.getElementById('craftsaints-produz').value = '';
            });
        }
        function removerCraftSaints(id) { db.collection("craftsSaints").doc(id).delete(); }

        // --- ROUPA ---
        function renderizarRoupas() {
            const container = document.getElementById('lista-roupas');
            if (!container) return;
            if (roupas.length === 0) {
                container.innerHTML = '<p style="color:#7a6c5d;">Nenhuma roupa registada.</p>';
                return;
            }
            container.innerHTML = '';
            roupas.forEach((r) => {
                const imgHtml = r.img ? `<div style="margin-top:10px;"><img src="${r.img}" alt="${r.nome}" style="max-width:100%; height:auto; border-radius:4px; border:1px solid #36281e;" onerror="this.style.display='none'"></div>` : '';
                container.innerHTML += `
                <div style="background:#14100c; border:1px solid #36281e; padding:14px; border-radius:4px; margin-bottom:12px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong style="color:#e6dfcc; font-size:1rem;">👕 ${r.nome}</strong>
                        <button onclick="removerRoupa('${r.id}')" style="background:none; border:none; color:#9e2a2b; cursor:pointer; font-weight:bold; font-size:1rem;">✕</button>
                    </div>
                    ${imgHtml}
                </div>`;
            });
        }
        function adicionarRoupa(e) {
            e.preventDefault();
            const nome = document.getElementById('roupa-nome').value.trim();
            const img = document.getElementById('roupa-img').value.trim();
            db.collection("roupas").add({ nome, img }).then(() => {
                document.getElementById('roupa-nome').value = '';
                document.getElementById('roupa-img').value = '';
            });
        }
        function removerRoupa(id) { db.collection("roupas").doc(id).delete(); }

        // --- RECEITAS ---
        function renderizarReceitas() {
            const container = document.getElementById('lista-receitas');
            if (!container) return;
            if (receitas.length === 0) {
                container.innerHTML = '<p style="color:#7a6c5d;">Nenhuma receita registada.</p>';
                return;
            }
            container.innerHTML = '';
            receitas.forEach((r) => {
                container.innerHTML += `
                <div style="background:#14100c; border:1px solid #36281e; padding:14px; border-radius:4px; margin-bottom:12px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <strong style="color:#e6dfcc; font-size:1rem;">📜 ${r.nome}</strong>
                        <button onclick="removerReceita('${r.id}')" style="background:none; border:none; color:#9e2a2b; cursor:pointer; font-weight:bold; font-size:1rem;">✕</button>
                    </div>
                    <p style="color:#b8a894; font-size:0.9rem; margin:0; white-space:pre-line; line-height:1.4;">${r.ingredientes}</p>
                </div>`;
            });
        }
        function adicionarReceita(e) {
            e.preventDefault();
            const nome = document.getElementById('receita-nome').value.trim();
            const ingredientes = document.getElementById('receita-ingredientes').value.trim();
            db.collection("receitas").add({ nome, ingredientes }).then(() => {
                document.getElementById('receita-nome').value = '';
                document.getElementById('receita-ingredientes').value = '';
            });
        }
        function removerReceita(id) { db.collection("receitas").doc(id).delete(); }

        // --- SELECTS ---
        function atualizarSelectProdutos() {
            const select = document.getElementById('cli-select-produto');
            if (!select) return;
            select.innerHTML = '<option value="">Selecionar produto...</option>';
            tabelaArmas.forEach((p, idx) => {
                select.innerHTML += `<option value="${idx}">${p.nome} (${parseFloat(p.preco).toFixed(2)} €)</option>`;
            });
        }
        function atualizarSelectArmas() {
            const select = document.getElementById('enc-select-arma');
            if (!select) return;
            select.innerHTML = '<option value="">Selecionar arma da tabela...</option>';
            tabelaArmas.forEach((a, idx) => {
                select.innerHTML += `<option value="${idx}">${a.nome} (${parseFloat(a.preco).toFixed(2)} €)</option>`;
            });
            atualizarSelectProdutos();
        }

        // --- PEDIDOS DE CLIENTES ---
        function adicionarItemAoCarrinho() {
            const prodIdx = document.getElementById('cli-select-produto').value;
            const qtd = parseInt(document.getElementById('cli-qtd').value);
            if (prodIdx === "") return alert("Selecione um produto da tabela!");
            const prod = tabelaArmas[prodIdx];
            carrinhoAtual.push({ nome: prod.nome, preco: prod.preco, qtd: qtd, subtotal: prod.preco * qtd });
            renderizarCarrinho();
        }
        function removerItemCarrinho(idx) {
            carrinhoAtual.splice(idx, 1);
            renderizarCarrinho();
        }
        function renderizarCarrinho() {
            const container = document.getElementById('carrinho-itens');
            const inputTotal = document.getElementById('cli-total-manual');
            container.innerHTML = '';
            let total = 0;
            carrinhoAtual.forEach((item, i) => {
                total += item.subtotal;
                container.innerHTML += `<div style="display:flex; justify-content:space-between; color:#b8a894; font-size:0.85rem; margin-top:5px; border-bottom:1px solid #231a13; padding-bottom:3px;">
                    <span>• ${item.qtd}x ${item.nome} (${item.subtotal.toFixed(2)} €)</span>
                    <button type="button" onclick="removerItemCarrinho(${i})" style="background:none;border:none;color:#9e2a2b;cursor:pointer;">✕</button>
                </div>`;
            });
            inputTotal.value = total.toFixed(2);
        }
        function guardarPedidoCompleto(e) {
            e.preventDefault();
            const cliente = document.getElementById('cli-nome').value.trim();
            const total = parseFloat(document.getElementById('cli-total-manual').value);
            if (carrinhoAtual.length === 0) return alert("Adicione pelo menos um produto ao pedido antes de guardar!");
            
            db.collection("pedidosClientes").add({ cliente, itens: [...carrinhoAtual], total }).then(() => {
                carrinhoAtual = [];
                renderizarCarrinho();
                document.getElementById('cli-nome').value = '';
            });
        }
        function renderizarPedidosClientes() {
            const container = document.getElementById('lista-pedidos-pendentes');
            const contador = document.getElementById('contador-pedidos-clientes');
            if (contador) contador.textContent = pedidosClientes.length;
            if (!container) return;
            if (pedidosClientes.length === 0) {
                container.innerHTML = '<p style="color:#7a6c5d;">Nenhum pedido de cliente registado.</p>';
                return;
            }
            container.innerHTML = '';
            pedidosClientes.forEach((p) => {
                const itensStr = p.itens.map(it => `${it.qtd}x ${it.nome}`).join(', ');
                container.innerHTML += `<div style="background:#14100c; border:1px solid #36281e; padding:12px; border-radius:4px; margin-bottom:10px; color:#b8a894;">
                    <div style="display:flex; justify-content:space-between;"><strong style="color:#e6dfcc;">👤 ${p.cliente}</strong><button onclick="removerPedidoCliente('${p.id}')" style="background:none;border:none;color:#9e2a2b;cursor:pointer;font-weight:bold;">✕</button></div>
                    <p style="margin:5px 0; font-size:0.9rem;">📦 Itens: ${itensStr}</p>
                    <p style="margin:0; color:#c5a059;"><strong>💰 Valor Total: ${p.total.toFixed(2)} €</strong></p>
                </div>`;
            });
        }
        function removerPedidoCliente(id) { db.collection("pedidosClientes").doc(id).delete(); }

        // --- ENCOMENDAS ---
        function renderizarEncomendas() {
            const container = document.getElementById('lista-encomendas');
            const contador = document.getElementById('contador-encomendas');
            if (contador) contador.textContent = encomendasFeitas.length;
            if (!container) return;
            container.innerHTML = encomendasFeitas.length === 0 ? '<p style="color:#7a6c5d;">Nenhuma encomenda registada.</p>' : '';
            encomendasFeitas.forEach((e) => {
                container.innerHTML += `<div style="background:#14100c; border:1px solid #36281e; padding:12px; border-radius:4px; margin-bottom:10px; color:#b8a894;">
                    <div style="display:flex; justify-content:space-between;"><strong style="color:#e6dfcc;">📑 ${e.tipo} - ${e.empresa}</strong><button onclick="removerEncomenda('${e.id}')" style="background:none;border:none;color:#9e2a2b;cursor:pointer;font-weight:bold;">✕</button></div>
                    <p style="margin:5px 0;">👤 Responsável: ${e.pessoa}</p>
                    <p style="margin:5px 0;">🛒 Pedido: ${e.item}</p>
                    <p style="margin:0; color:#c5a059;"><strong>🧾 Fatura / Gasto Total: ${e.gasto.toFixed(2)} €</strong></p>
                </div>`;
            });
        }
        function adicionarEncomendaManual(e) {
            e.preventDefault();
            const pessoa = document.getElementById('enc-man-pessoa').value.trim();
            const empresa = document.getElementById('enc-man-empresa').value.trim();
            const item = document.getElementById('enc-man-item').value.trim();
            const gasto = parseFloat(document.getElementById('enc-man-gasto').value);
            db.collection("encomendasFeitas").add({ tipo: "Geral", pessoa, empresa, item, gasto }).then(() => {
                document.getElementById('enc-man-pessoa').value = '';
                document.getElementById('enc-man-empresa').value = '';
                document.getElementById('enc-man-item').value = '';
                document.getElementById('enc-man-gasto').value = '';
            });
        }
        function adicionarEncomendaArmas(e) {
            e.preventDefault();
            const pessoa = document.getElementById('enc-arm-pessoa').value.trim();
            const empresa = document.getElementById('enc-arm-empresa').value.trim();
            const armaIdx = document.getElementById('enc-select-arma').value;
            const qtd = parseInt(document.getElementById('enc-arm-qtd').value);
            if(armaIdx === "") return alert("Selecione uma arma da tabela!");
            const arma = tabelaArmas[armaIdx];
            const gasto = arma.preco * qtd;
            db.collection("encomendasFeitas").add({ tipo: "Armamento", pessoa, empresa, item: `${qtd}x ${arma.nome}`, gasto }).then(() => {
                document.getElementById('enc-arm-pessoa').value = '';
                document.getElementById('enc-arm-empresa').value = '';
                document.getElementById('enc-select-arma').value = '';
                document.getElementById('enc-arm-qtd').value = '1';
            });
        }
        function removerEncomenda(id) { db.collection("encomendasFeitas").doc(id).delete(); }

        // --- SPOTS ---
        function adicionarSpot(tipo, event) {
            event.preventDefault();
            const nomeInput = document.getElementById(`spot-${tipo}-nome`);
            const infoInput = document.getElementById(`spot-${tipo}-info`);
            const imgInput = document.getElementById(`spot-${tipo}-img`);
            const spot = {
                nome: nomeInput.value.trim(),
                info: infoInput.value.trim(),
                img: imgInput ? imgInput.value.trim() : ''
            };
            db.collection("spotsFarm").add(spot).then(() => {
                nomeInput.value = '';
                infoInput.value = '';
                if (imgInput) imgInput.value = '';
            });
        }
        function removerSpot(tipo, id, event) {
            event.stopPropagation();
            db.collection("spotsFarm").doc(id).delete();
        }
        function toggleSpotDetalhes(idElemento) {
            const el = document.getElementById(idElemento);
            const seta = document.getElementById('seta-' + idElemento);
            if (el) {
                if (el.style.display === 'none') {
                    el.style.display = 'block';
                    if (seta) seta.textContent = '▼';
                } else {
                    el.style.display = 'none';
                    if (seta) seta.textContent = '▶';
                }
            }
        }
        function renderizarSpots(tipo) {
            const container = document.getElementById(`lista-spots-${tipo}`);
            if (!container) return;
            if (spots[tipo].length === 0) {
                container.innerHTML = '<p style="color: #7a6c5d;">Nenhum spot registado.</p>';
                return;
            }
            container.innerHTML = '';
            spots[tipo].forEach((spot, index) => {
                const idDetalhe = `detalhe-${tipo}-${index}`;
                const imgHtml = spot.img ? `<div style="margin-top:10px;"><img src="${spot.img}" alt="${spot.nome}" style="max-width:100%; height:auto; border-radius:4px; border:1px solid #36281e;" onerror="this.style.display='none'"></div>` : '';
                container.innerHTML += `
                <div style="background:#14100c; border:1px solid #36281e; border-radius:4px; margin-bottom:10px; overflow:hidden;">
                    <div onclick="toggleSpotDetalhes('${idDetalhe}')" style="padding:12px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; user-select:none; background:#18130f;">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <span id="seta-${idDetalhe}" style="color:#c5a059; font-size:0.8rem;">▶</span>
                            <strong style="color:#c5a059; font-size:0.95rem;">${spot.info}</strong>
                        </div>
                        <button onclick="removerSpot('${tipo}', '${spot.id}', event)" style="background:none; border:none; color:#9e2a2b; cursor:pointer; font-weight:bold; font-size:1rem; padding:0 5px;">✕</button>
                    </div>
                    <div id="${idDetalhe}" style="display:none; padding:12px; border-top:1px solid #281e15; background:#100d0a;">
                        <p style="margin:0 0 5px 0; color:#e6dfcc; font-size:0.9rem;"><strong>📍 Local:</strong> ${spot.nome}</p>
                        ${imgHtml}
                    </div>
                </div>`;
            });
        }

        // Iniciar carregamento dos dados mal a página abra
        window.onload = function() {
            carregarDados();
        };
    </script>
</body>
</html>
